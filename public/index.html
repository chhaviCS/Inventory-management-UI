<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="theme.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h2>Add New Product</h2>
            <div class="header-actions">
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle Theme">
                    <i id="themeIcon" data-lucide="moon"></i>
                </button>
                <div id="authNav" style="display: flex; align-items: center; gap: 0.5rem;">
                    <a href="/login" class="btn btn-edit" id="loginBtn" style="display: inline-flex; align-items: center; gap: 0.4rem; text-decoration: none; padding: 0.5rem 0.85rem;">
                        <i data-lucide="user"></i> Login
                    </a>
                </div>
                <a href="/products-page" class="add-btn" style="background-color: var(--text-muted); display: flex; align-items: center; gap: 0.5rem;">
                    <i data-lucide="list"></i> View Inventory
                </a>
            </div>
        </header>

        <div class="form-container">
            <form id="form">
                <div class="form-group">
                    <label for="name">Product Name</label>
                    <input type="text" id="name" placeholder="Enter product name" required>
                </div>
                <div class="form-group">
                    <label for="price">Price ($)</label>
                    <input type="number" id="price" placeholder="0.00" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" placeholder="0" required>
                </div>
                <div class="form-group">
                    <label for="image">Image URL</label>
                    <input type="text" id="image" placeholder="https://example.com/image.jpg">
                </div>
                <button type="submit" class="btn-submit">Add Product</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        (function() {
            const token = localStorage.getItem("token");
            const userStr = localStorage.getItem("user");
            const authNav = document.getElementById("authNav");
            if (token && authNav) {
                let name = "User";
                try {
                    const user = JSON.parse(userStr);
                    if (user && user.name) name = user.name;
                } catch (e) {}
                authNav.innerHTML = `
                    <span style="font-size: 0.875rem; color: var(--text-muted); display: inline-flex; align-items: center; gap: 0.35rem; font-weight: 500;">
                        <i data-lucide="user-check"></i> ${name}
                    </span>
                    <button id="logoutBtn" class="btn btn-edit" style="display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.5rem 0.75rem;">
                        Logout
                    </button>
                `;
                document.getElementById("logoutBtn").addEventListener("click", () => {
                    localStorage.removeItem("token");
                    localStorage.removeItem("user");
                    window.location.href = "/login";
                });
            }
        })();
        if (window.lucide) {
            lucide.createIcons();
        }
    </script>
</body>
</html>
