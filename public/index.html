<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="theme.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h2>Add New Product</h2>
            <div class="header-actions">
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle Theme">
                    <i id="themeIcon" data-lucide="moon"></i>
                </button>
                <a href="/products-page" class="add-btn" style="background-color: var(--text-muted); display: flex; align-items: center; gap: 0.5rem;">
                    <i data-lucide="list"></i> View Inventory
                </a>
            </div>
        </header>

        <div class="form-container">
            <form id="form">
                <div class="form-group">
                    <label for="name">Product Name</label>
                    <input type="text" id="name" placeholder="Enter product name" required>
                </div>
                <div class="form-group">
                    <label for="price">Price ($)</label>
                    <input type="number" id="price" placeholder="0.00" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" placeholder="0" required>
                </div>
                <div class="form-group">
                    <label for="image">Image URL</label>
                    <input type="text" id="image" placeholder="https://example.com/image.jpg">
                </div>
                <button type="submit" class="btn-submit">Add Product</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if (window.lucide) {
            lucide.createIcons();
        }
    </script>
</body>
</html>
