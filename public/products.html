<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="container">
        <header>
            <h2>Product Inventory</h2>
            <a href="/" class="add-btn">Add New Product</a>
        </header>

        <div class="dashboard">
            <div class="stat-card">
                <div class="stat-icon icon-blue"><i data-lucide="package"></i></div>
                <div class="stat-info">
                    <p class="stat-label">Total Products</p>
                    <h3 id="totalProducts">0</h3>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-green"><i data-lucide="dollar-sign"></i></div>
                <div class="stat-info">
                    <p class="stat-label">Total Value</p>
                    <h3 id="totalValue">$0.00</h3>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-orange"><i data-lucide="alert-triangle"></i></div>
                <div class="stat-info">
                    <p class="stat-label">Low Stock</p>
                    <h3 id="lowStock">0</h3>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-purple"><i data-lucide="trending-up"></i></div>
                <div class="stat-info">
                    <p class="stat-label">Most Expensive</p>
                    <h3 id="topPrice">$0.00</h3>
                </div>
            </div>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search products by name..." aria-label="Search products">
        </div>

        <div id="products"></div>
    </div>

    <!-- Edit Product Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Product</h2>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label for="editName">Product Name</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label for="editPrice">Price ($)</label>
                    <input type="number" id="editPrice" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="editQuantity">Quantity</label>
                    <input type="number" id="editQuantity" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="products.js"></script>
</body>
</html>
