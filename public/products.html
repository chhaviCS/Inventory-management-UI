<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="theme.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h2>Product Inventory</h2>
            <div class="header-actions">
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle Theme">
                    <i id="themeIcon" data-lucide="moon"></i>
                </button>
                <div id="authNav" style="display: flex; align-items: center; gap: 0.5rem;">
                    <a href="/login" class="btn btn-edit" id="loginBtn" style="display: inline-flex; align-items: center; gap: 0.4rem; text-decoration: none; padding: 0.5rem 0.85rem;">
                        <i data-lucide="user"></i> Login
                    </a>
                </div>
                <a href="/" class="add-btn">Add New Product</a>
            </div>
        </header>

        <div class="dashboard">
            <div class="stat-card">
                <div class="stat-icon icon-blue"><i data-lucide="package"></i></div>
                <div class="stat-info">
                    <p class="stat-label">Total Products</p>
                    <h3 id="totalProducts">0</h3>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-green"><i data-lucide="dollar-sign"></i></div>
                <div class="stat-info">
                    <p class="stat-label">Total Value</p>
                    <h3 id="totalValue">$0.00</h3>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-orange"><i data-lucide="alert-triangle"></i></div>
                <div class="stat-info">
                    <p class="stat-label">Low Stock</p>
                    <h3 id="lowStock">0</h3>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-purple"><i data-lucide="trending-up"></i></div>
                <div class="stat-info">
                    <p class="stat-label">Most Expensive</p>
                    <h3 id="topPrice">$0.00</h3>
                </div>
            </div>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search products by name..." aria-label="Search products">
        </div>

        <div id="products"></div>
    </div>

    <!-- Edit Product Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Product</h2>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label for="editName">Product Name</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label for="editPrice">Price ($)</label>
                    <input type="number" id="editPrice" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="editQuantity">Quantity</label>
                    <input type="number" id="editQuantity" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="products.js"></script>
    <script>
        (function() {
            const token = localStorage.getItem("token");
            const userStr = localStorage.getItem("user");
            const authNav = document.getElementById("authNav");
            if (token && authNav) {
                let name = "User";
                try {
                    const user = JSON.parse(userStr);
                    if (user && user.name) name = user.name;
                } catch (e) {}
                authNav.innerHTML = `
                    <span style="font-size: 0.875rem; color: var(--text-muted); display: inline-flex; align-items: center; gap: 0.35rem; font-weight: 500;">
                        <i data-lucide="user-check"></i> ${name}
                    </span>
                    <button id="logoutBtn" class="btn btn-edit" style="display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.5rem 0.75rem;">
                        Logout
                    </button>
                `;
                document.getElementById("logoutBtn").addEventListener("click", () => {
                    localStorage.removeItem("token");
                    localStorage.removeItem("user");
                    window.location.href = "/login";
                });
                if (window.lucide) {
                    lucide.createIcons();
                }
            }
        })();
    </script>
</body>
</html>
